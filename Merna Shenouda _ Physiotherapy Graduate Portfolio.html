<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merna Shenouda | Physiotherapy Graduate Portfolio</title>

<meta property="og:title" content="Merna Shenouda | Physiotherapy Graduate Portfolio">
<meta property="og:description" content="Physiotherapy Graduate, Deraya University, Class of 2026.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#102A43;--blue:#2878A8;--aqua:#55C4C7;--bg:#fff;--bg2:#F3F7FA;--tx:#1E293B;--mu:#64748B;--hd:#102A43;--ln:rgba(16,42,67,.12);--nav:rgba(255,255,255,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B2B;--bg2:#102A43;--tx:#D8E2EC;--mu:#97A9BC;--hd:#F3F7FA;--ln:rgba(243,247,250,.14);--nav:rgba(11,27,43,.82);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1B2B;--bg2:#102A43;--tx:#D8E2EC;--mu:#97A9BC;--hd:#F3F7FA;--ln:rgba(243,247,250,.14);--nav:rgba(11,27,43,.82);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--tx);font:400 17px/1.7 Manrope,Cairo,system-ui,sans-serif;transition:background .4s,color .4s;overflow-x:hidden;overflow-wrap:break-word}
.hg>*,.ab>*,.cg>*,.sk>*,.fg>*{min-width:0}
dd,.tag,h2,h3{overflow-wrap:anywhere}
[dir=rtl] body{font-family:Cairo,Manrope,sans-serif;line-height:1.9}
h1,h2,h3{color:var(--hd);line-height:1.12;letter-spacing:-.02em;font-weight:800}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{letter-spacing:0;line-height:1.35}
a{color:inherit}
:focus-visible{outline:3px solid var(--aqua);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:104px 0}
.alt{background:var(--bg2)}
h2{font-size:clamp(2rem,4.6vw,3.4rem);max-width:15ch}
.sub{color:var(--mu);font-size:1.15rem;max-width:46ch;margin-top:16px}
.mu{color:var(--mu)}
/* nav */
header{position:fixed;inset:env(safe-area-inset-top,0px) 0 auto;z-index:20;transition:background .3s,box-shadow .3s;border-bottom:1px solid transparent}
header.s{background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.logo{font-weight:800;color:var(--hd);text-decoration:none}
nav ul{display:flex;gap:26px;list-style:none;padding:0}
nav a{text-decoration:none;font-size:.92rem;font-weight:500;color:var(--tx);position:relative;padding:6px 0}
nav a:after{content:"";position:absolute;inset:auto 0 0;height:2px;background:var(--aqua);transform:scaleX(0);transition:transform .3s;transform-origin:left}
[dir=rtl] nav a:after{transform-origin:right}
nav a.on:after,nav a:hover:after{transform:scaleX(1)}
.tools{display:flex;gap:8px;align-items:center}
.ib{min-width:44px;height:44px;border-radius:99px;border:1px solid var(--ln);background:transparent;color:var(--hd);cursor:pointer;font:600 .85rem inherit;font-family:inherit;padding:0 14px;transition:background .2s}
.ib:hover{background:var(--bg2)}
#bg{display:none}
@media(max-width:1080px){#bg{display:inline-block}nav{position:fixed;inset:calc(72px + env(safe-area-inset-top,0px)) 0 auto;background:var(--bg);border-bottom:1px solid var(--ln);max-height:0;overflow:hidden;transition:max-height .4s}nav.o{max-height:480px}nav ul{flex-direction:column;gap:0;padding:12px 24px 20px}nav a{display:block;padding:14px 0;font-size:1.05rem}}
/* hero */
#home{min-height:100svh;display:flex;align-items:center;padding:130px 0 80px;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 85% 20%,rgba(85,196,199,.18),transparent 60%),var(--bg)}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
h1{font-size:clamp(2.6rem,7vw,5.4rem)}
.lead{font-size:1.2rem;color:var(--mu);max-width:48ch;margin:24px 0 32px}
.status{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;color:var(--blue);margin-bottom:22px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--aqua);animation:pu 2.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(85,196,199,0)}0%{box-shadow:0 0 0 0 rgba(85,196,199,.6)}}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 28px;border-radius:99px;font:700 .98rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;border:1.5px solid var(--navy);transition:transform .25s,background .25s,color .25s;margin:0 10px 10px 0}
[dir=rtl] .btn{margin:0 0 10px 10px}
.btn.p{background:var(--navy);color:#fff}
.btn.g{background:transparent;color:var(--hd);border-color:var(--ln)}
[data-theme=dark] .btn.p,:root:not([data-theme=light]) .btn.p{background:var(--aqua);color:var(--navy);border-color:var(--aqua)}
.btn:hover{transform:translateY(-3px)}
.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;transform:none}
.stage{position:relative;aspect-ratio:4/5;max-width:440px;margin-inline:auto;width:100%}
.stage svg.arc{position:absolute;inset:-5%;width:110%;height:110%;overflow:visible}
.arc path{fill:none;stroke:var(--aqua);stroke-width:2;stroke-linecap:round}
.arc .t{stroke:var(--ln);stroke-width:1}
#sw{transform-origin:50% 50%;animation:sw 7s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.pf{position:absolute;inset:0;border-radius:46% 54% 42% 58%/38% 42% 58% 62%;overflow:hidden;background:linear-gradient(160deg,var(--blue),var(--navy));box-shadow:0 40px 80px -30px rgba(16,42,67,.5)}
.pf img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.halo{position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(closest-side,rgba(85,196,199,.35),transparent);animation:br 5s ease-in-out infinite alternate}
@keyframes br{from{transform:scale(.92);opacity:.6}to{transform:scale(1.08);opacity:1}}
.orbit{position:absolute;inset:-9%;width:118%;height:118%;animation:spin 28s linear infinite}
.orbit .ring{fill:none;stroke:var(--aqua);stroke-width:.6;stroke-dasharray:2 5}.orbit .dot{fill:var(--aqua)}.orbit .dot2{fill:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.pf{z-index:1;animation:fy 7s ease-in-out infinite alternate}
@keyframes fy{to{transform:translateY(-10px)}}
.plus{position:absolute;z-index:2;font-weight:800;font-size:1.8rem;color:var(--aqua);animation:fy 4.5s ease-in-out infinite alternate}
.p1{top:6%;inset-inline-start:-3%}.p2{bottom:14%;inset-inline-end:-4%;animation-delay:-2s}
/* reveals */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.hero-in>*{animation:hi .9s cubic-bezier(.2,.7,.2,1) both}
.hero-in>*:nth-child(2){animation-delay:.12s}.hero-in>*:nth-child(3){animation-delay:.24s}.hero-in>*:nth-child(4){animation-delay:.36s}.hero-in>*:nth-child(5){animation-delay:.48s}
@keyframes hi{from{opacity:0;transform:translateY(30px)}}
/* about */
.ab{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;margin-top:56px;align-items:start}
.big{font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.4;color:var(--hd);font-weight:600}
[dir=rtl] .big{line-height:1.7}
.pts{margin-top:28px;display:grid;gap:14px;list-style:none;padding:0}
.pts li{padding-inline-start:22px;position:relative}
.pts li:before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:10px;height:2px;background:var(--aqua)}
/* profile */
dl{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border-top:1px solid var(--ln)}
dl div{padding:24px 20px 24px 0;border-bottom:1px solid var(--ln)}
[dir=rtl] dl div{padding:24px 0 24px 20px}
dt{font-size:.85rem;color:var(--mu)}dd{font-weight:700;color:var(--hd);font-size:1.08rem;margin-top:4px}
/* timeline */
.tl{position:relative;margin-top:56px;padding-inline-start:36px;display:grid;gap:36px}
.tl:before{content:"";position:absolute;inset-block:6px 0;inset-inline-start:7px;width:2px;background:var(--ln)}
.tl:after{content:"";position:absolute;inset-block-start:6px;inset-inline-start:7px;width:2px;height:var(--p,0%);background:linear-gradient(var(--aqua),var(--blue));transition:height .2s}
.it{position:relative}
.it:before{content:"";position:absolute;inset-inline-start:-36px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--blue)}
.alt .it:before{background:var(--bg2)}
.it h3{font-size:1.5rem}
.org{color:var(--blue);font-weight:700;margin:4px 0 10px}
[data-theme=dark] .org{color:var(--aqua)}
details{border-top:1px solid var(--ln);margin-top:14px;max-width:70ch}
summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--hd);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";transition:transform .3s}details[open] summary::after{transform:rotate(45deg)}
details ul{padding-inline-start:20px;display:grid;gap:8px;padding-bottom:12px}
.tag{display:inline-block;padding:8px 16px;margin:0 8px 10px 0;border:1px solid var(--ln);border-radius:99px;font-size:.93rem;transition:all .25s;cursor:default}
[dir=rtl] .tag{margin:0 0 10px 8px}
.tag:hover{background:var(--aqua);color:var(--navy);border-color:var(--aqua);transform:translateY(-2px)}
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:48px 64px;margin-top:56px}
.sk h3{font-size:1.2rem;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--aqua);display:inline-block}
/* interests */
.ig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:56px;border-top:1px solid var(--ln);border-inline-start:1px solid var(--ln)}
.ig>div{padding:32px 28px;border-bottom:1px solid var(--ln);border-inline-end:1px solid var(--ln);transition:background .3s}
.ig>div:hover{background:var(--bg2)}
.ig svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.6;margin-bottom:16px;transition:transform .4s}
.ig>div:hover svg{transform:scale(1.12) rotate(-6deg)}
.ig h3{font-size:1.1rem;margin-bottom:8px}.ig p{font-size:.95rem;color:var(--mu);line-height:1.6}
/* approach */
.ap{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;counter-reset:s;position:relative}
.ap div{padding:0 24px 0 0;position:relative;padding-top:56px}
[dir=rtl] .ap div{padding:56px 0 0 24px}
.ap div:before{counter-increment:s;content:counter(s);position:absolute;top:0;inset-inline-start:0;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;z-index:1}
.ap:before{content:"";position:absolute;top:19px;inset-inline:0;height:2px;background:var(--ln)}
.ap h3{font-size:1.2rem;margin-bottom:8px}.ap p{font-size:.95rem;color:var(--mu);line-height:1.6}
/* cards */
.empty{margin-top:40px;padding:36px;border:1.5px dashed var(--ln);border-radius:20px;max-width:640px;color:var(--mu)}
.cv{background:var(--navy);color:#D8E2EC}
.cv h2,.cv .sub{color:#fff}.cv .sub{opacity:.8}
.cv .btn.p{background:var(--aqua);color:var(--navy);border-color:var(--aqua)}
.cv .btn.g{color:#fff;border-color:rgba(255,255,255,.3)}
.cv small{display:block;margin-top:8px;opacity:.7}
.rc{text-align:center;padding:120px 0}.rc h2{margin:0 auto;max-width:18ch;font-size:clamp(2.2rem,5.4vw,4rem)}.rc .sub{margin-inline:auto}
.cg{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;margin-top:48px}
.ci p{padding:16px 0;border-bottom:1px solid var(--ln)}.ci b{display:block;font-size:.85rem;color:var(--mu);font-weight:600}
form{display:grid;gap:18px}
label{font-size:.9rem;font-weight:600;color:var(--hd);display:grid;gap:6px}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:13px 16px;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{outline:0;border-color:var(--aqua);box-shadow:0 0 0 4px rgba(85,196,199,.25)}
input:invalid:not(:placeholder-shown),textarea:invalid:not(:placeholder-shown){border-color:#d9534f}
#fm{font-size:.92rem;min-height:1.4em;color:var(--blue)}
footer{background:var(--navy);color:#B9C8D8;padding:64px 0 40px;position:relative;overflow:hidden}
footer:before{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--blue),var(--aqua),var(--blue));background-size:200%;animation:fl 8s linear infinite}
@keyframes fl{to{background-position:200%}}
.fg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}
footer h3{color:#fff;font-size:1.3rem}footer a{display:block;text-decoration:none;padding:4px 0}footer a:hover{color:var(--aqua)}
.cp{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:.85rem}
footer .ib{color:#fff;border-color:rgba(255,255,255,.3);margin-top:12px}
@media(max-width:900px){section{padding:72px 0}.hg,.ab,.cg,.sk{grid-template-columns:minmax(0,1fr);gap:40px}.stage{width:78%}.stage{max-width:320px;order:-1;margin-bottom:24px}dl,.ig{grid-template-columns:repeat(2,minmax(0,1fr))}.ap{grid-template-columns:1fr 1fr;row-gap:40px}.ap:before{display:none}}
@media(max-width:560px){dl,.ig,.ap{grid-template-columns:minmax(0,1fr)}.ig>div{padding:24px 20px}.wrap{padding:0 20px}.btn{width:100%;justify-content:center;margin-inline:0!important}.tl{padding-inline-start:30px}.it:before{inset-inline-start:-30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
